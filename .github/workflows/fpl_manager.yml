name: FPL Automated Gameweek Manager

on:
  # Runs every 2 hours to ensure prompt execution and account for GitHub cron delays
  schedule:
    - cron: '0 */2 * * *'
  
  # Allows you to trigger the bot manually at any time with 1 click
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run Mode (Simulate without submitting live changes)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_run:
        description: 'Force Run (Execute immediately even if outside the deadline window)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  manage-team:
    name: Optimize & Manage FPL Squad
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 Run FPL Bot
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID || '8662144' }}
          FPL_COOKIE: ${{ secrets.FPL_COOKIE }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
          HOURS_BEFORE_DEADLINE: '24.0'
          MIN_TRANSFER_IMPROVEMENT: '0.75'
          MAX_TRANSFERS: '1'
          # Email Notification Settings
          SMTP_HOST: 'smtp.gmail.com'
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER || 'markjclayton@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL || 'markjclayton@gmail.com' }}
        run: |
          python main.py

      - name: 💾 Save Sent State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_emailed_gw.txt || true
          git diff --staged --quiet || (git commit -m "chore: record emailed gameweek state [skip ci]" && git push origin master) || true
